{% extends "v3_base.html" %}
{% block title %}考试复习计划{% endblock %}
{% block body %}
<div class="v3-title">
  <div>
    <h1>考试倒计时与复习计划</h1>
    <p>告诉它考试时间，它按你的复习节奏把待复习的题排到每一天。</p>
  </div>
  <button class="v3-btn primary" id="new-exam-btn" type="button">+ 新建考试</button>
</div>

<section class="v3-card" id="exam-form-card" hidden style="margin-bottom:18px">
  <form id="exam-form" class="v3-grid" style="gap:10px">
    <div class="v3-row">
      <div class="v3-field" style="margin:0"><label>考试名称</label><input class="v3-input" id="f-title" placeholder="例如：高等数学期末" maxlength="40" required></div>
      <div class="v3-field" style="margin:0"><label>科目</label><select class="v3-select" id="f-subject"></select></div>
    </div>
    <div class="v3-row">
      <div class="v3-field" style="margin:0"><label>考试时间</label><input class="v3-input" id="f-time" type="datetime-local" required></div>
      <div class="v3-field" style="margin:0"><label>备注（可选）</label><input class="v3-input" id="f-note" placeholder="考场 / 范围" maxlength="200"></div>
    </div>
    <div class="v3-row" style="flex:0 0 auto">
      <button class="v3-btn primary" type="submit" style="flex:0 0 auto">保存</button>
      <button class="v3-btn ghost" type="button" id="cancel-exam" style="flex:0 0 auto">取消</button>
    </div>
  </form>
</section>

<div class="v3-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start" id="exam-layout">
  <div class="v3-grid" id="exam-list"><div class="v3-empty">正在加载考试…</div></div>
  <div class="v3-card" id="exam-detail" hidden></div>
</div>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='js/v3-exam.js') }}?v={{ asset_version }}"></script>
{% endblock %}
