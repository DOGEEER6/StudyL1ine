{% extends "v3_base.html" %}
{% block title %}PK 对战{% endblock %}
{% block body %}
<div class="v3-title">
  <div>
    <h1>异步 PK 对战</h1>
    <p>同一套题，两个人各自限时做，服务器比正确率和用时。不用同时在线。</p>
  </div>
</div>

<section id="view-home">
  <div class="v3-card" style="margin-bottom:16px">
    <div class="v3-row" style="align-items:flex-end">
      <div class="v3-field" style="margin:0">
        <label>发起对战：选择科目</label>
        <select class="v3-select" id="duel-subject"></select>
      </div>
      <button class="v3-btn primary" id="create-duel" type="button" style="flex:0 0 auto">创建对局</button>
      <div class="v3-field" style="margin:0">
        <label>加入别人的对局</label>
        <input class="v3-input" id="join-code" placeholder="输入邀请码，例如 A1B2C3" maxlength="8">
      </div>
      <button class="v3-btn" id="join-duel" type="button" style="flex:0 0 auto">加入</button>
    </div>
  </div>

  <div class="v3-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start">
    <div>
      <h3 style="font-size:15px;margin:0 0 10px">我的对局</h3>
      <div class="v3-grid" id="duel-list"><div class="v3-empty">加载中…</div></div>
    </div>
    <div>
      <h3 style="font-size:15px;margin:0 0 10px">大厅（等人加入）</h3>
      <div class="v3-grid" id="duel-lobby"><div class="v3-empty">加载中…</div></div>
    </div>
  </div>
</section>

<section id="view-play" hidden>
  <div class="v3-card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><span class="v3-chip" id="play-subject">对战</span> <span class="v3-muted" id="play-meta"></span></div>
      <div>本题用时 <span class="duel-timer" id="play-timer">0.0s</span></div>
    </div>
    <div class="duel-progress" id="play-progress" style="margin:12px 0"></div>
    <h2 style="font-size:16px;margin:0 0 6px" id="play-title"></h2>
    <div class="duel-q" id="play-problem"></div>
    <div class="duel-answer-row">
      <input class="v3-input" id="play-answer" placeholder="写下你的答案，回车提交" autocomplete="off">
      <button class="v3-btn primary" id="play-submit" type="button" style="flex:0 0 auto">提交</button>
    </div>
    <p class="v3-muted" id="play-feedback" style="margin-top:10px"></p>
    <hr class="v3-hr">
    <button class="v3-btn" id="play-finish" type="button">全部答完，交卷</button>
  </div>
</section>

<section id="view-result" hidden>
  <div class="v3-card">
    <h2 style="margin:0 0 4px;font-size:19px" id="result-title">对战结果</h2>
    <div id="result-body"></div>
    <hr class="v3-hr">
    <button class="v3-btn" id="result-back" type="button">返回</button>
  </div>
</section>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='js/v3-duel.js') }}?v={{ asset_version }}"></script>
{% endblock %}
