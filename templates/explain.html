{% extends "v3_base.html" %}
{% block title %}我来讲解{% endblock %}
{% block body %}
<div class="v3-title">
  <div>
    <h1>我来讲解</h1>
    <p>你当老师，AI 当刚学这一章的同学。讲不清楚的地方，它会追问到你想明白为止。</p>
  </div>
  <span class="v3-chip" id="turn-chip">第 0 / 5 轮</span>
</div>

<section class="v3-card" style="margin-bottom:16px" id="entry-card" hidden>
  <div class="v3-muted" style="font-size:12px;margin-bottom:4px">你正在讲这道题</div>
  <div id="entry-problem" style="font-size:15px"></div>
</section>

<section class="v3-card">
  <div class="chat" id="chat"></div>
  <div class="v3-hr"></div>
  <div class="duel-answer-row">
    <input class="v3-input" id="say-input" placeholder="用你自己的话讲给 TA 听，回车发送" autocomplete="off">
    <button class="v3-btn primary" id="say-send" type="button" style="flex:0 0 auto">发送</button>
  </div>
  <p class="v3-muted" style="margin:8px 0 0">讲满 5 轮，AI 会给你一个评价：讲清楚了没有、哪里含糊、下一步练什么。</p>
</section>

<section class="v3-card eval-card" id="eval-card" hidden style="margin-top:16px">
  <h3 style="margin:0 0 6px;font-size:16px">这轮讲解的评价</h3>
  <p id="eval-score" style="font-size:28px;font-weight:700;margin:0;color:var(--v3-accent)"></p>
  <p id="eval-verdict" style="margin:6px 0 10px"></p>
  <div id="eval-weak"></div>
  <p class="v3-muted" id="eval-next"></p>
  <button class="v3-btn" id="eval-again" type="button">再讲一遍</button>
</section>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='js/v3-explain.js') }}?v={{ asset_version }}"></script>
{% endblock %}
