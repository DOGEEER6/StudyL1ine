{% extends "v3_base.html" %}
{% block title %}代码题{% endblock %}
{% block mainclass %}wide{% endblock %}
{% block body %}
<div class="v3-title">
  <div>
    <h1>代码题：在线编译 + AI 评分</h1>
    <p>把题目要求贴进来，写完代码直接跑测试点；判题在隔离容器里进行，出错不会影响网站。</p>
  </div>
  <span class="v3-chip" id="judge-status">检测判题环境…</span>
</div>

<div class="code-layout">
  <div class="v3-grid">
    <section class="v3-card">
      <div class="v3-field">
        <label>题目要求（可以从错题里带入）</label>
        <textarea class="v3-textarea" id="code-requirement" placeholder="例如：输入两个整数，输出它们的和。"></textarea>
      </div>
      <div class="v3-field" style="margin-bottom:6px">
        <label>测试点（标准输入 → 期望输出）</label>
        <div id="test-list"></div>
        <button class="v3-btn small" id="add-test" type="button">+ 添加测试点</button>
      </div>
    </section>

    <section class="v3-card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <button class="v3-btn primary" id="run-code" type="button">运行</button>
        <button class="v3-btn" id="ai-review" type="button">AI 点评</button>
        <button class="v3-btn" id="save-code" type="button">保存到这道题</button>
        <span class="v3-muted" id="save-hint"></span>
      </div>
      <textarea class="code-area" id="code-source" spellcheck="false">#include &lt;iostream&gt;
using namespace std;

int main() {
    // 在这里写代码

    return 0;
}</textarea>
    </section>
  </div>

  <section class="v3-card" id="result-card" hidden style="margin-top:16px">
    <h3 style="margin:0 0 8px;font-size:15px">运行结果</h3>
    <div id="run-summary" style="margin-bottom:8px"></div>
    <div class="run-result" id="run-detail"></div>
  </section>

  <section class="v3-card" id="review-card" hidden style="margin-top:16px">
    <h3 style="margin:0 0 8px;font-size:15px">AI 点评</h3>
    <div id="review-body"></div>
  </section>
</div>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='js/v3-code.js') }}?v={{ asset_version }}"></script>
{% endblock %}
