<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>练习卷 · 学线 LearnL1ne</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}?v={{ asset_version }}">
</head>
<body class="print-page">
  <div class="print-toolbar">
    <a class="print-back" href="/">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span>返回时间线</span>
    </a>
    <div class="print-toolbar-title">练习卷</div>
    <div class="print-toolbar-actions">
      <span class="print-hint">A4 · 浏览器打印可另存为 PDF</span>
      <button class="print-btn" id="print-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 18H4.5A1.5 1.5 0 0 1 3 16.5v-6A1.5 1.5 0 0 1 4.5 9h15a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H17"/><rect x="7" y="14" width="10" height="6.5" rx="1"/></svg>
        打印 / 存为 PDF
      </button>
    </div>
  </div>

  <main class="sheet" id="print-root">
    <div class="sheet-loading">正在整理练习卷…</div>
  </main>

  <script src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='vendor/katex/contrib/auto-render.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/print.js') }}?v={{ asset_version }}" defer></script>
</body>
</html>
