<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f7fd">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}第二遍{% endblock %} · 第二遍</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/v3.css') }}?v={{ asset_version }}">
</head>
<body class="v3-page">
  <header class="v3-top">
    <a class="v3-brand" href="/"><span class="mark">遍</span><span>第二遍</span></a>
    <nav class="v3-nav">
      <a href="/">错题本</a>
      <a href="/learning">学习状况</a>
      <a href="/exam" data-page="exam">考试计划</a>
      <a href="/duel" data-page="duel">PK 对战</a>
      <a href="/code" data-page="code">代码题</a>
    </nav>
    <span class="v3-user">{{ username }}</span>
  </header>
  <main class="v3-main {% block mainclass %}{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  <div id="v3-toasts"></div>
  <script src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/katex/contrib/auto-render.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/v3.js') }}?v={{ asset_version }}"></script>
  <script>
    document.querySelectorAll('.v3-nav a[data-page]').forEach(function (a) { a.classList.add('active'); });
  </script>
  {% block script %}{% endblock %}
</body>
</html>
