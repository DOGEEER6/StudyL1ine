<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2f7fd">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}StudyL1ne{% endblock %} · StudyL1ne</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/v3.css') }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}?v={{ asset_version }}">
  {% block head %}{% endblock %}
</head>
<body class="v3-page" data-entry-id="{{ entry_id|default('', true) }}">
  {% include 'icons.html' %}
  {% set mode = 'page' %}
  {% include '_topbar.html' %}
  <main class="v3-main {% block mainclass %}{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  <div id="v3-toasts"></div>
  <script src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/katex/contrib/auto-render.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/topbar.js') }}?v={{ asset_version }}"></script>
  <script src="{{ url_for('static', filename='js/v3.js') }}?v={{ asset_version }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
